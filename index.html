<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>H7 Gallery</title>

<style>
:root{
    --bg:#f7f7f7;
    --card:#ffffff;
    --text:#111111;
    --primary:#ff3b5c;
    --border:#e5e5e5;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI, sans-serif;
    background:var(--bg);
    color:var(--text);
}

header{
    width:100%;
    padding:20px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:white;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:1000;
    gap:20px;
}

.logo{
    font-size:32px;
    font-weight:900;
    letter-spacing:2px;
    white-space:nowrap;
}

.logo span{
    color:var(--primary);
}

/* IMAGE IN HEADER */

.header-image{
    flex:1;
    display:flex;
    justify-content:center;
    padding:0 20px;
}

.header-image img{
    width:100%;
    max-width:340px;
    height:75px;
    object-fit:cover;
    border-radius:16px;
}

.social-links{
    display:flex;
    gap:14px;
}

.social-links a{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f2f2f2;
    border-radius:14px;
    transition:0.3s ease;
}

.social-links a:hover{
    background:var(--primary);
    transform:translateY(-2px);
}

.social-links svg{
    width:22px;
    height:22px;
    fill:var(--primary);
}

.social-links a:hover svg{
    fill:white;
}

.hero{
    padding:70px 20px 40px;
    text-align:center;
}

.hero h1{
    font-size:clamp(2.2rem,5vw,4rem);
    margin-bottom:12px;
}

.hero p{
    color:#666;
    max-width:650px;
    margin:auto;
    line-height:1.7;
    font-size:1rem;
}

.gallery{
    columns:3 300px;
    column-gap:20px;
    padding:20px 5% 70px;
    max-width:1500px;
    margin:auto;
}

.image-card{
    background:var(--card);
    border-radius:24px;
    overflow:hidden;
    margin-bottom:20px;
    break-inside:avoid;
    border:1px solid var(--border);
    box-shadow:0 5px 18px rgba(0,0,0,0.05);
    transition:0.3s ease;
}

.image-card:hover{
    transform:translateY(-4px);
}

.image-card img{
    width:100%;
    display:block;
    cursor:pointer;
    transition:0.4s ease;
}

.image-card:hover img{
    transform:scale(1.03);
}

.card-content{
    padding:14px;
}

.download-btn{
    width:100%;
    border:none;
    background:var(--primary);
    color:white;
    padding:12px;
    border-radius:14px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s ease;
}

.download-btn:hover{
    opacity:0.92;
    letter-spacing:0.5px;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:3000;
    padding:20px;
}

.modal img{
    max-width:95%;
    max-height:90%;
    border-radius:18px;
}

footer{
    text-align:center;
    padding:30px;
    border-top:1px solid var(--border);
    background:white;
    color:#777;
}

@media(max-width:768px){

    header{
        padding:18px;
        gap:10px;
    }

    .logo{
        font-size:26px;
    }

    .hero{
        padding-top:50px;
    }

    .gallery{
        padding:15px;
        column-gap:15px;
    }

    .social-links a{
        width:38px;
        height:38px;
    }

    .header-image img{
        max-width:160px;
        height:55px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        H<span>7</span>
    </div>

    <div class="header-image">
        <img src="1779967877969.png" alt="Salé">
    </div>

    <div class="social-links">

        <a href="https://instagram.com/h7_ayoub" target="_blank">
            <svg viewBox="0 0 24 24">
                <path d="M7.75 2C4.57 2 2 4.57 2 7.75v8.5C2 19.43 4.57 22 7.75 22h8.5C19.43 22 22 19.43 22 16.25v-8.5C22 4.57 19.43 2 16.25 2h-8.5zm4.25 4.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zm6.5-.75a1.25 1.25 0 110 2.5 1.25 1.25 0 010-2.5z"/>
            </svg>
        </a>
        
    </div>

</header>

<section class="hero">
    <h1>Salé & Rabat Photo Gallery</h1>
    <p>
        Professional responsive gallery for showcasing high quality images
        with clean design and smooth experience.
    </p>
</section>

<div class="gallery" id="gallery"></div>

<div class="modal" id="modal">
    <img id="modalImg" src="">
</div>

<footer>
    © 2026 H7 Gallery
</footer>

<script>

const images = [

{
url:"file_00000000afec72469808e497b8fb2614.png"
},

{
url:"file_00000000b19472469c83cd2bbd5b1fa2.png"
},

{
url:"file_000000002ccc72468ef70359297de14d.png"
},

{
url:"file_000000005bb47246b6af89c98e518809.png"
},

{
url:"file_0000000052f87246abc5095ca0314a0b.png"
},

{
url:"file_0000000082f472468e8de14b33b95951.png"
},

{
url:"file_00000000487c7246a5ce0ac5f03ca0c8.png"
},

{
url:"file_00000000a3dc71f487f9bb2edf426ab9.png"
},

{
url:"file_00000000c99871f4bb695955cf370d38.png"
},

{
url:"file_00000000e3f072469e2590fa725c826a.png"
},

{
url:"file_0000000079ec71f49468401a2b41440b.png"
}

];

const gallery = document.getElementById("gallery");

images.forEach((img,index)=>{

    const card = document.createElement("div");

    card.className = "image-card";

    card.innerHTML = `

        <img 
            src="${img.url}"
            onclick="openModal('${img.url}')"
            loading="lazy"
            decoding="async"
        >

        <div class="card-content">

            <button class="download-btn"
                onclick="downloadImage('${img.url}','H7-image-${index}')">

                Download Image

            </button>

        </div>

    `;

    gallery.appendChild(card);

});

async function downloadImage(url, filename){

    try{

        const response = await fetch(url);

        const blob = await response.blob();

        const blobUrl = window.URL.createObjectURL(blob);

        const a = document.createElement("a");

        a.href = blobUrl;

        a.download = filename + ".jpg";

        document.body.appendChild(a);

        a.click();

        a.remove();

        window.URL.revokeObjectURL(blobUrl);

    }catch(err){

        window.open(url,"_blank");

    }
}

const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImg");

function openModal(src){

    modal.style.display = "flex";

    modalImg.src = src;

    document.body.style.overflow = "hidden";
}

modal.onclick = ()=>{

    modal.style.display = "none";

    document.body.style.overflow = "auto";
}

</script>

</body>
</html>
