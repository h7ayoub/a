<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H7 Gallery</title>

    <style>
        :root {
            --bg: #0a0a0a;
            --text: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.04);
            --primary: #ff4757;
            --border: #222;
        }

        .light-mode {
            --bg: #f5f5f5;
            --text: #111;
            --card-bg: #ffffff;
            --border: #ddd;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            text-align: center;
            transition: background 0.4s ease;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 5%;
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 1000;
        }

        .logo { font-size: 32px; font-weight: 900; letter-spacing: 2px; }
        .logo span { color: var(--primary); }

        #themeToggle {
            background: transparent;
            border: 1.5px solid var(--primary);
            color: var(--primary);
            padding: 8px 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .social-links { display: flex; gap: 15px; }
        .social-links svg { width: 24px; height: 24px; fill: var(--primary); }

        .filter-container { margin: 20px 0; }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 22px;
            border-radius: 30px;
            cursor: pointer;
            margin: 5px;
        }

        .filter-btn.active { background: var(--primary); border-color: var(--primary); color: white; }

        .gallery {
            column-count: 3;
            column-gap: 20px;
            padding: 20px 5%;
            max-width: 1400px;
            margin: auto;
            min-height: 400px;
        }

        @media (max-width: 900px) { .gallery { column-count: 2; } }
        @media (max-width: 600px) { .gallery { column-count: 1; } }

        .image-card {
            break-inside: avoid;
            margin-bottom: 20px;
            background: var(--card-bg);
            border-radius: 18px;
            padding: 12px;
            border: 1px solid var(--border);
            /* نجعلها مرئية افتراضياً لحل مشكلة الاختفاء */
            opacity: 1; 
            transform: translateY(0);
            transition: 0.4s;
        }

        .img-container { overflow: hidden; border-radius: 12px; }
        .image-card img { width: 100%; height: auto; display: block; cursor: zoom-in; }

        .download-btn {
            display: block;
            margin-top: 12px;
            padding: 10px;
            background: var(--primary);
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            border: none;
            width: 100%;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal img { max-width: 90%; max-height: 85%; border-radius: 8px; }

        footer { padding: 40px; color: #777; }
    </style>
</head>

<body>

<header>
    <button id="themeToggle">🌙</button>
    <div class="logo">H<span>7</span></div>
    <div class="social-links">
        <a href="#" target="_blank"><svg viewBox="0 0 24 24"><path d="M7.75 2C4.57 2 2 4.57 2 7.75v8.5C2 19.43 4.57 22 7.75 22h8.5C19.43 22 22 19.43 22 16.25v-8.5C22 4.57 19.43 2 16.25 2h-8.5zm4.25 4.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zm6.5-.75a1.25 1.25 0 110 2.5 1.25 1.25 0 010-2.5z"/></svg></a>
    </div>
</header>

<h1>Explore Gallery</h1>

<div class="filter-container">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="cars">Cars</button>
    <button class="filter-btn" data-filter="nature">Nature</button>
    <button class="filter-btn" data-filter="cats">Cats</button>
    <button class="filter-btn" data-filter="streets">Streets</button>
</div>

<div class="gallery" id="gallery"></div>

<div id="modal" class="modal"><img id="modalImg" src=""></div>

<footer>© 2026 H7 Gallery</footer>

<script>
    // تأكد من إضافة روابط صورك هنا في هذه القائمة
    const imagesData = [
        { category: 'cars', url: 'https://images.unsplash.com/photo-1503376780353-7e6692767b70' },
        { category: 'nature', url: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470' },
        { category: 'cats', url: 'https://images.unsplash.com/photo-1518791841217-8f162f1e1131' },
        { category: 'streets', url: 'https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b' },
        { category: 'cars', url: 'https://images.unsplash.com/photo-1494976388531-d1058494cdd8' },
        { category: 'nature', url: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e' }
    ];

    const gallery = document.getElementById("gallery");
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    function renderGallery(filter = 'all') {
        gallery.innerHTML = ""; // مسح المحتوى القديم
        
        // تصفية الصور بناءً على الفئة
        const filtered = filter === "all" ? imagesData : imagesData.filter(img => img.category === filter);

        // إضافة جميع الصور المصفاة فوراً
        filtered.forEach((img, index) => {
            const card = document.createElement("div");
            card.className = "image-card";
            card.innerHTML = `
                <div class="img-container">
                    <img src="${img.url}?auto=format&fit=crop&w=800&q=80" onclick="openModal('${img.url}')" loading="lazy">
                </div>
                <button class="download-btn" onclick="downloadImage('${img.url}', 'H7-${img.category}-${index}')">Download Image</button>
            `;
            gallery.appendChild(card);
        });
    }

    async function downloadImage(src, filename) {
        try {
            const response = await fetch(src);
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename + '.jpg';
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        } catch (e) {
            window.open(src, '_blank');
        }
    }

    function openModal(src) {
        modalImg.src = src;
        modal.style.display = "flex";
    }

    modal.onclick = () => modal.style.display = "none";

    document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.onclick = (e) => {
            document.querySelector(".filter-btn.active").classList.remove("active");
            e.target.classList.add("active");
            renderGallery(e.target.dataset.filter);
        };
    });

    const themeToggle = document.getElementById("themeToggle");
    themeToggle.onclick = () => {
        document.body.classList.toggle("light-mode");
        themeToggle.textContent = document.body.classList.contains("light-mode") ? "☀️" : "🌙";
    };

    // تشغيل العرض عند فتح الصفحة
    renderGallery();
</script>

</body>
</html>
